<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Contact : écrivez-moi pour une question, une opportunité ou un projet." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-whoami">

  <!-- NAVIGATION -->
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="about.html" data-i18n="nav.whoami">Qui suis-je ?</a>
        <a href="index.html#projects" data-i18n="nav.projects">Projets</a>
        <a href="index.html#skills" data-i18n="nav.skills">Compétences</a>
        <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="nav-tools">
        <button class="icon-btn lang-btn" id="langBtn" type="button">EN</button>
        <button class="icon-btn theme-btn" id="themeBtn" type="button" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" data-i18n="nav.home">Accueil</a>
    <a href="about.html" data-i18n="nav.whoami">Qui suis-je ?</a>
    <a href="index.html#projects" data-i18n="nav.projects">Projets</a>
    <a href="index.html#skills" data-i18n="nav.skills">Compétences</a>
    <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
  </div>

  <main id="top">

    <!-- CONTACT -->
    <section class="page-hero" id="contact">
      <div class="wrap contact-grid">
        <div class="contact-left reveal">
          <h1 class="h1 contact-title" data-i18n="contact.title">Me contacter</h1>
          <p class="contact-text" data-i18n="contact.text"></p>
          <a class="contact-email" id="contactEmail" href="#"></a>
          <ul class="contact-list" id="contactList"></ul>
          <div class="socials" id="socials"></div>
        </div>
        <form class="contact-form reveal" id="contactForm" method="POST">
          <div class="form-row">
            <label class="field"><span data-i18n="form.name">Nom</span><input type="text" name="name" required autocomplete="name" /></label>
            <label class="field"><span data-i18n="form.email">Email</span><input type="email" name="email" required autocomplete="email" /></label>
          </div>
          <label class="field"><span data-i18n="form.subject">Sujet</span><input type="text" name="subject" required /></label>
          <label class="field"><span data-i18n="form.message">Message</span><textarea name="message" rows="5" required></textarea></label>
          <button type="submit" class="btn btn-accent btn-block" data-i18n="form.send">Envoyer le message</button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>
      </div>
    </section>

  </main>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
