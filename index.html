<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio de Gabriel Michaud : projets de jeux vidéo, compétences et parcours." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVIGATION -->
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="projets.html" data-i18n="nav.projects">Projets</a>
        <a href="parcours.html" data-i18n="nav.path">Parcours</a>
        <a href="competences.html" data-i18n="nav.skills">Compétences</a>
        <a href="about.html" data-i18n="nav.whoami">Qui suis-je ?</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="nav-tools">
        <button class="icon-btn lang-btn" id="langBtn" type="button">EN</button>
        <button class="icon-btn theme-btn" id="themeBtn" type="button" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" data-i18n="nav.home">Accueil</a>
    <a href="projets.html" data-i18n="nav.projects">Projets</a>
    <a href="parcours.html" data-i18n="nav.path">Parcours</a>
    <a href="competences.html" data-i18n="nav.skills">Compétences</a>
    <a href="about.html" data-i18n="nav.whoami">Qui suis-je ?</a>
    <a href="contact.html" data-i18n="nav.contact">Contact</a>
  </div>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-text">
          <h1 class="hero-name reveal">
            <span class="first" data-fill="profile.firstName">Prénom</span>
            <span class="last" data-fill="profile.lastName">Nom</span>
          </h1>
          <p class="hero-location reveal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span data-fill="profile.location">Lyon, France</span>
          </p>
        </div>
        <div class="hero-visual reveal">
          <div class="hero-frame" id="heroPhoto"></div>
        </div>
      </div>
    </section>

    <!-- BANDEAU DÉFILANT -->
    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

    <!-- À PROPOS -->
    <section class="section" id="about">
      <div class="wrap">
        <div class="about-grid">
          <h2 class="h2 about-title reveal" data-fill="about.title"></h2>
          <div class="about-body reveal">
            <div id="aboutParagraphs"></div>
            <div class="tags" id="aboutTags"></div>
          </div>
        </div>
        <div class="stats reveal" id="aboutStats"></div>
      </div>
    </section>

    <!-- MENU : un gros bouton par page -->
    <section class="home-menu-section">
      <div class="wrap">
        <nav class="hero-menu home-menu reveal" aria-label="Pages du portfolio">
          <a href="projets.html" class="hero-link is-primary"><span data-i18n="hero.projects">Voir mes projets</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="parcours.html" class="hero-link"><span data-i18n="hero.path">Voir mon parcours</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="competences.html" class="hero-link"><span data-i18n="hero.skills">Voir mes compétences</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="about.html" class="hero-link"><span data-i18n="nav.whoami">Qui suis-je ?</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="contact.html" class="hero-link"><span data-i18n="hero.contact">Me contacter</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="#" class="hero-link" id="cvLink" download><span data-i18n="hero.cv">Télécharger mon CV</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg></a>
        </nav>
      </div>
    </section>

  </main>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
